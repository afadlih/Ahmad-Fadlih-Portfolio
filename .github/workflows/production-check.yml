name: Production Route Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 23 * * 0"

permissions:
  contents: read

concurrency:
  group: portfolio-production-check
  cancel-in-progress: true

jobs:
  live-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Validate production URL configuration
        run: node scripts/validate-release-environment.mjs
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.PORTFOLIO_PUBLIC_URL }}
          PORTFOLIO_PUBLIC_URL: ${{ vars.PORTFOLIO_PUBLIC_URL }}

      - name: Check public routes
        run: node scripts/check-public-url.mjs --required
        env:
          PORTFOLIO_PUBLIC_URL: ${{ vars.PORTFOLIO_PUBLIC_URL }}
