name: Static Analysis

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate ast-grep rules
        run: npm run quality:ast-grep:test

      - name: Run ast-grep structural rules
        run: npm run quality:ast-grep

      - name: Run Knip module-graph analysis
        run: npm run quality:knip

      - name: Run jscpd duplication gate
        run: npm run quality:jscpd

      - name: Upload jscpd report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-report
          path: .quality/jscpd
          if-no-files-found: ignore

  fallow-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Audit changed code with Fallow
        uses: fallow-rs/fallow@v2
        with:
          command: audit
          config: .fallowrc.jsonc
          gate: new-only
          fail-on-issues: true
          format: sarif
